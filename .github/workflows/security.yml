# Pipeline DevSecOps – phase v1 : scans shift-left, résultats SARIF, image scannée puis publiée sur GHCR.
# Les seuils bloquants (quality gate), l'épinglage des actions par SHA et la signature Cosign arrivent en v2.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan de l'historique complet
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect \
            --source /repo --redact --report-format sarif --report-path /repo/gitleaks.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  semgrep:
    name: Semgrep CE (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - run: pip install --quiet semgrep
      - name: Scan
        run: semgrep scan --config p/ci --config p/typescript --config p/nodejs --sarif --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  dependency-check:
    name: OWASP Dependency-Check (SCA)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # v1 : informatif. Sans clé NVD (secret NVD_API_KEY, gratuite), la première mise à jour de la base est très lente.
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: ~/dc-data
          key: dc-data-${{ github.run_id }}
          restore-keys: dc-data-
      - name: Scan
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p ~/dc-data reports && chmod -R 777 ~/dc-data reports
          docker run --rm -v "$PWD:/src" -v "$HOME/dc-data:/usr/share/dependency-check/data" \
            owasp/dependency-check:latest --scan /src --format SARIF --format HTML --out /src/reports \
            --exclude '**/node_modules/**' ${NVD_API_KEY:+--nvdApiKey "$NVD_API_KEY"}
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: dependency-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports/

  trivy-fs:
    name: Trivy (fichiers et configuration)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - name: Scan
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest fs \
            --scanners vuln,secret,misconfig --severity HIGH,CRITICAL \
            --format sarif --output /src/trivy-fs.sarif /src
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  checkov:
    name: Checkov (IaC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - run: pip install --quiet checkov
      - name: Scan Dockerfiles et workflows
        run: checkov -d . --framework dockerfile github_actions --soft-fail --output sarif --output-file-path reports
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/results_sarif.sarif
          category: checkov

  image:
    name: Image ${{ matrix.app }} (build, scan, publication)
    runs-on: ubuntu-latest
    needs: [gitleaks, semgrep, trivy-fs, checkov]
    permissions:
      contents: read
      security-events: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    env:
      IMAGE: ghcr.io/kaisoueriemmi/printbox-${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Tag (jamais « latest »)
        run: echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build local pour le scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:3001' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Trivy image – rapport SARIF (HIGH, CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" aquasec/trivy:latest image \
            --severity HIGH,CRITICAL --format sarif --output /out/trivy-image.sarif "$IMAGE:$TAG"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ matrix.app }}
      - name: Trivy image – garde-fou (CRITICAL corrigeable bloque la publication)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:$TAG"
      - name: Connexion à GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:3001' }}
          cache-from: type=gha,scope=${{ matrix.app }}
