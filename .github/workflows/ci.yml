name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: printbox
          POSTGRES_PASSWORD: printbox
          POSTGRES_DB: printbox
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U printbox -d printbox"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://printbox:printbox@localhost:5432/printbox
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Migrations apply and match the Prisma schema
        working-directory: apps/api
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma migrate diff --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://printbox:printbox@localhost:5432/postgres \
            --exit-code
      - name: API integration tests (Testcontainers)
        run: pnpm test:integration

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: check
    env:
      QR_TOKEN_SECRET: ci-only-placeholder-secret-0123456789abcdef
      SESSION_TOKEN_SECRET: ci-only-placeholder-session-secret-0123456789
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build api web

  agent-exe:
    name: Windows agent executable
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      # @yao-pkg/pkg needs Node >= 22 to build (the agent code itself targets Node 20+).
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @printbox/shared build
      - run: pnpm --filter @printbox/agent package
      - name: Assemble the release folder
        run: |
          mkdir -p release
          cp apps/agent/bin/printbox-agent.exe apps/agent/scripts/*.ps1 \
             apps/agent/agent.config.example.json apps/agent/README.md release/
      - uses: actions/upload-artifact@v4
        with:
          name: printbox-agent-windows
          path: release/
          retention-days: 30
