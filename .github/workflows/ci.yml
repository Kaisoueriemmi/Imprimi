name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: printbox
          POSTGRES_PASSWORD: printbox
          POSTGRES_DB: printbox
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U printbox -d printbox"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://printbox:printbox@localhost:5432/printbox
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Migrations apply and match the Prisma schema
        working-directory: apps/api
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma migrate diff --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://printbox:printbox@localhost:5432/postgres \
            --exit-code

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: check
    env:
      QR_TOKEN_SECRET: ci-only-placeholder-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build api web
